name: Rebuild CV

# Runs whenever a talk or a paper is added, edited or removed — either through
# the control room (admin.html) or by hand. Rebuilds both PDFs so they always
# match the website. Pushes made by the weekly workflow use GITHUB_TOKEN and
# therefore do not trigger this run, so the two cannot loop.

on:
  push:
    branches: [main]
    paths:
      - "pdf/cv.json"
      - "pdf/cv_template.html"
      - "data/publications.json"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rebuild-cv
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the PDF renderer
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Rebuild cv.pdf and cv_short.pdf
        run: python3 pdf/build_cv.py --local

      - name: Commit and push if anything changed
        run: |
          git config user.name "cv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cv.pdf cv_short.pdf
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "chore: rebuild CV"
          git push
