name: Rebuild CV

# Runs whenever a talk, a paper or anything else is added, edited or removed,
# either through the control room (admin.html) or by hand. Rebuilds both PDFs
# so they always match the website. Pushes made by the weekly workflow use
# GITHUB_TOKEN and therefore do not trigger this run, so the two cannot loop.

on:
  push:
    branches: [main]
    paths:
      - "pdf/cv.json"
      - "pdf/cv_template.html"
      - "pdf/build_cv.py"
      - "data/publications.json"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: site-write        # never runs at the same time as the weekly update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the PDF renderer
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Rebuild the PDFs, commit and push
        run: |
          git config user.name  "cv-bot"
          git config user.email "actions@users.noreply.github.com"

          # If a new commit lands while we are rendering, the push is rejected.
          # Then we take their version, rebuild on top of it and try again.
          for attempt in 1 2 3; do
            python3 pdf/build_cv.py --local

            git add cv.pdf cv_short.pdf
            if git diff --cached --quiet; then
              echo "PDFs already up to date."
              exit 0
            fi
            git commit -m "chore: rebuild CV"

            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            echo "Push rejected - somebody else was faster. Rebasing and rebuilding."
            git reset --hard HEAD~1
            git pull --rebase --quiet
          done

          echo "Still could not push after three attempts."
          exit 1
