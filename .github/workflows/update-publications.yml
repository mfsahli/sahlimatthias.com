name: Update publications and CV

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday, 06:00 UTC (~07:00/08:00 Bern time)
  workflow_dispatch: {}    # manual trigger via the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update publications (Google Scholar via SerpAPI if key set, else Semantic Scholar & OpenAlex)
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python3 scripts/update_publications.py

      - name: Install the PDF renderer
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Rebuild cv.pdf and cv_short.pdf
        run: python3 pdf/build_cv.py --local

      - name: Commit and push if anything changed
        run: |
          git config user.name "publication-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/publications.json index.html cv.pdf cv_short.pdf
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "chore: weekly publication and CV update"
          git push
